<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="8" />

  <!-- Subtle Inner Grid / Radar Pattern -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.4" />

  <!-- Glowing Playwright Automation Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#symbolGrad)" stroke-width="10" stroke-linecap="round" stroke-dasharray="240 180" filter="url(#glow)" opacity="0.85" />

  <!-- Central Speech Bubble / Audio Hub -->
  <path d="M160 170 C160 142 182 120 210 120 L302 120 C330 120 352 142 352 170 L352 270 C352 298 330 320 302 320 L240 320 L180 365 L190 320 L210 320 C182 320 160 298 160 270 Z" fill="#0f172a" stroke="url(#symbolGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Bold Central Typography: 'EN' -->
  <text x="256" y="245" font-family="DejaVu Sans, Arial, sans-serif" font-size="82" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="2">EN</text>

  <!-- Play Triangle Icon under EN -->
  <polygon points="242,265 242,295 276,280" fill="url(#symbolGrad)" />

  <!-- Lightning / Automation Spark Badge -->
  <g transform="translate(320, 110) scale(1.1)">
    <circle cx="24" cy="24" r="32" fill="#0f172a" stroke="#fbbf24" stroke-width="4" />
    <path d="M28 8 L14 26 L23 26 L20 40 L34 22 L25 22 Z" fill="url(#sparkGrad)" />
  </g>

  <!-- Subtitle Tag: STUDIO -->
  <rect x="176" y="396" width="160" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <text x="256" y="419" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#38bdf8" letter-spacing="4">STUDIO</text>
</svg>